name: Release

# Push a version tag (e.g. `git tag 1.0.9 && git push origin 1.0.9`) to build the jar and create a DRAFT release
# with the matching section of CHANGELOG.md. Nothing is published until you press "Publish release" on GitHub.

on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Release notes from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v tag="$TAG" '
            /^## / { if (found) exit; if ($0 ~ "^## \\[" tag "\\]") { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $TAG" > release-notes.md
          fi
          cat release-notes.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Void Sky Fix ${{ github.ref_name }}
          body_path: release-notes.md
          files: build/libs/voidskyfix-${{ github.ref_name }}.jar
          fail_on_unmatched_files: true
